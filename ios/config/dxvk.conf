# GeneralsX iOS DXVK runtime configuration
#
# Keep sampler-type spec constants disabled (terrain shader stability baseline,
# same as the macOS deployment).
d3d9.forceSamplerTypeSpecConstants = False

# 16x anisotropic filtering: the RTS camera views terrain at a shallow angle,
# where plain trilinear filtering smears the ground textures into mud. Free on
# a modern mobile GPU.
d3d9.samplerAnisotropy = 16

# No debug logging in normal play: the d3d9 log regrows by hundreds of KB per
# session and is only useful when actively debugging the renderer.
dxvk.logLevel = none

# iOS memory/presentation tuning.
# Keep defragmentation disabled: it adds synchronization work and can cause
# frame-time spikes on MoltenVK while the game is actively streaming assets.
dxvk.enableMemoryDefrag = False

# Let the engine's 60 FPS frame pacer control cadence rather than forcing a
# hard VSync interval that can fall from 60 to 30 after a missed frame.
dxvk.tearFree = True

# Keep the older shader path used by this D3D9/DXVK port and avoid pipeline-
# library feature paths that are not reliable across the supported iOS GPUs.
dxvk.enableGraphicsPipelineLibrary = False
d3d9.shaderModel = 1

# Advertise a bounded DXVK D3D9 memory budget; this is a budget, not a 3 GB
# allocation, and prevents the allocator from assuming unbounded VRAM.
d3d9.maxAvailableMemory = 3072
