; iPadOverrides.ini
; Put this file in the app's Documents folder through Apple Devices/iTunes/Finder.
; It is loaded LAST, after GameData.ini and SagePatch.ini.
; Fully close and reopen the game after changing it.
;
; Recommended starting profile for iPad + Zero Hour Enhanced.

GameData
  MaxCameraHeight = 550.0
  MinCameraHeight = 70.0
  CameraPitch = 37.0
  EnforceMaxCameraHeight = No

  KeyboardScrollSpeedFactor = 1.0
  TerrainDrawDistanceScale = 1.45

  UseFPSLimit = Yes
  FramesPerSecondLimit = 60
End
