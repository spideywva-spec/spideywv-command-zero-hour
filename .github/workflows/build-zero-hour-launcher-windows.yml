name: Legacy | Launcher | Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - feature/flutter-zero-hour-launcher
    paths:
      - 'launcher_flutter/**'
      - '.github/workflows/build-zero-hour-launcher-windows.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'launcher_flutter/**'
      - '.github/workflows/build-zero-hour-launcher-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: launcher_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Windows runner
        run: flutter create --platforms=windows .

      - name: Remove generated sample test
        shell: pwsh
        run: Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release
        run: flutter build windows --release

      - name: Package release
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) {
            throw "Release directory not found: $release"
          }
          Compress-Archive -Path "$release/*" -DestinationPath "../ZeroHourLauncher-Windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroHourLauncher-Windows
          path: ZeroHourLauncher-Windows.zip
          if-no-files-found: error
          retention-days: 14
