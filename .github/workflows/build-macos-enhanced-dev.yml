name: Enhanced | macOS | Dev Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-enhanced-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Enhanced macOS arm64
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout DXVK fork
        run: git submodule update --init --recursive --depth 1 references/fbraz3-dxvk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '18ff00a7d2697e23f22e2a2293c3fa6468a50c06'

      - name: Install build tools
        run: |
          brew update
          brew install cmake ninja meson pkg-config autoconf autoconf-archive automake libtool glslang
          brew install ffmpeg freetype fontconfig sdl3

      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.4.341.1"
          ZIP="/tmp/vulkansdk-macos-${VERSION}.zip"
          URL="https://sdk.lunarg.com/sdk/download/${VERSION}/mac/vulkansdk-macos-${VERSION}.zip"
          SHA256="632cbe96c8ed6ed00c6ce25e3a7738c466134f76586e1c51f1419410d7f9042e"
          EXTRACT="/tmp/vulkan-extract"
          ROOT="$HOME/VulkanSDK/${VERSION}"

          curl -fL --retry 3 --retry-delay 5 -o "${ZIP}" "${URL}"
          echo "${SHA256}  ${ZIP}" | shasum -a 256 -c -
          rm -rf "${EXTRACT}"
          mkdir -p "${EXTRACT}"
          unzip -q "${ZIP}" -d "${EXTRACT}"

          INSTALLER=$(find "${EXTRACT}" -path "*/Contents/MacOS/vulkansdk-macOS-${VERSION}" -type f | head -1)
          test -n "${INSTALLER}"
          chmod +x "${INSTALLER}"
          "${INSTALLER}" --root "${ROOT}" --accept-licenses --default-answer --confirm-command install

          if [[ -d "${ROOT}/macOS" ]]; then SDK="${ROOT}/macOS"; else SDK="${ROOT}"; fi
          test -f "${SDK}/lib/libMoltenVK.dylib"
          test -f "${SDK}/lib/libvulkan.dylib"
          echo "VULKAN_SDK=${SDK}" >> "${GITHUB_ENV}"
          echo "${SDK}/bin" >> "${GITHUB_PATH}"

      - name: Configure macOS arm64
        env:
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: arm64-osx
          CC: clang
          CXX: clang++
        run: |
          mkdir -p logs
          cmake --preset macos-vulkan 2>&1 | tee logs/configure_macos.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Build engine
        run: |
          mkdir -p logs
          NPROC=$(sysctl -n hw.ncpu)
          cmake --build build/macos-vulkan --target z_generals -j "${NPROC}" 2>&1 | tee logs/build_macos.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Verify binary
        run: |
          BIN="build/macos-vulkan/GeneralsMD/GeneralsXZH"
          test -f "${BIN}"
          file "${BIN}"
          file "${BIN}" | grep -q "Mach-O"
          lipo -info "${BIN}" | grep -q "arm64"

      - name: Package Enhanced dev app
        env:
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
        run: |
          chmod +x scripts/build/macos/package-macos-enhanced-dev.sh
          ./scripts/build/macos/package-macos-enhanced-dev.sh 2>&1 | tee logs/package_macos.log
          test ${PIPESTATUS[0]} -eq 0
          test -f GeneralsZH-Enhanced-macos-arm64.tar

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-Enhanced-macos-arm64
          path: GeneralsZH-Enhanced-macos-arm64.tar
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-Enhanced-macos-build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "## macOS Enhanced Dev" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Architecture: Apple Silicon arm64" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Runtime: SDL3 + DXVK + MoltenVK" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Retail GameData: not included" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Enhanced data: imported locally from the user's IPA" >> "${GITHUB_STEP_SUMMARY}"
