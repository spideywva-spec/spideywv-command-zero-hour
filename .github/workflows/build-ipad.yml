name: Original | iPad | Full Build

on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build-ipad:
    name: Build iPadOS ARM64
    runs-on: macos-latest
    timeout-minutes: 180

    env:
      VULKAN_VERSION: "1.4.341.1"
      VULKAN_SHA256: "632cbe96c8ed6ed00c6ce25e3a7738c466134f76586e1c51f1419410d7f9042e"
      GX_MOLTENVK_ROOT: ${{ github.workspace }}/ios-staging/MoltenVK
      GX_FONTS: ${{ github.workspace }}/ios-staging/fonts

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "dc1232a6e05dcc49703091e83743e3b4df9b9b7c"

      - name: Install build tools
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            meson \
            pkg-config \
            xcodegen \
            glslang \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            nasm

          cmake --version
          ninja --version
          meson --version
          xcodebuild -version

      - name: Install LunarG Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${VULKAN_VERSION}"
          ZIP="/tmp/vulkansdk.zip"
          EXTRACT="/tmp/vulkansdk"

          URL="https://sdk.lunarg.com/sdk/download/${VERSION}/mac/vulkansdk-macos-${VERSION}.zip"

          echo "Downloading Vulkan SDK ${VERSION}"
          curl -fL --retry 3 \
            -o "${ZIP}" \
            "${URL}"

          echo "${VULKAN_SHA256}  ${ZIP}" | shasum -a 256 -c -

          rm -rf "${EXTRACT}"
          mkdir -p "${EXTRACT}"
          unzip -q "${ZIP}" -d "${EXTRACT}"

          INSTALLER="$(find "${EXTRACT}" \
            -type f \
            -path "*/Contents/MacOS/vulkansdk-macOS-*" \
            | head -1)"

          if [ -z "${INSTALLER}" ]; then
            INSTALLER="$(find "${EXTRACT}" \
              -type f \
              -name "vulkansdk-macOS-*" \
              | head -1)"
          fi

          if [ -z "${INSTALLER}" ]; then
            echo "Vulkan SDK installer not found"
            exit 1
          fi

          chmod +x "${INSTALLER}"

          ROOT="${HOME}/VulkanSDK/${VERSION}"

          "${INSTALLER}" \
            --root "${ROOT}" \
            --accept-licenses \
            --default-answer \
            --confirm-command install

          if [ -d "${ROOT}/macOS" ]; then
            SDK="${ROOT}/macOS"
          else
            SDK="${ROOT}"
          fi

          echo "VULKAN_SDK=${SDK}" >> "${GITHUB_ENV}"

          echo "Vulkan SDK:"
          echo "${SDK}"

          test -f "${SDK}/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

      - name: Prepare iOS dependencies
        shell: bash
        run: |
          set -euo pipefail

          git submodule update --init references/fbraz3-dxvk

          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

          test -d \
            "${GX_MOLTENVK_ROOT}/MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework"

          test -f "${GX_FONTS}/arial.ttf"

      - name: Configure iPadOS build
        shell: bash
        env:
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
        run: |
          set -euo pipefail

          echo "VULKAN_SDK=${VULKAN_SDK}"
          echo "VCPKG_ROOT=${VCPKG_ROOT}"

          cmake --preset ios-vulkan

      - name: Build Zero Hour ARM64
        shell: bash
        run: |
          set -euo pipefail

          JOBS="$(sysctl -n hw.ncpu)"

          cmake \
            --build build/ios-vulkan \
            --target z_generals \
            -j "${JOBS}"

          GAME_BIN="build/ios-vulkan/GeneralsMD/GeneralsXZH.app/GeneralsXZH"

          test -f "${GAME_BIN}"

          echo "Engine:"
          file "${GAME_BIN}"

          echo "Platform:"
          otool -l "${GAME_BIN}" | \
            grep -A3 LC_BUILD_VERSION | head -20 || true

      - name: Build unsigned iOS shell
        shell: bash
        run: |
          set -euo pipefail

          cd ios
          xcodegen generate

          cd ..

          xcodebuild \
            -project ios/GeneralsXZH.xcodeproj \
            -scheme GeneralsXZH \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.generalszh.ipad" \
            build

      - name: Assemble unsigned app
        shell: bash
        run: |
          set -euo pipefail

          BUILD="build/ios-vulkan"
          SHELL_APP="ios/build/Build/Products/Release-iphoneos/GeneralsXZH.app"
          GAME_BIN="${BUILD}/GeneralsMD/GeneralsXZH.app/GeneralsXZH"

          OUT="${RUNNER_TEMP}/GeneralsZH-iPad"
          APP="${OUT}/Payload/GeneralsXZH.app"

          rm -rf "${OUT}"
          mkdir -p "${OUT}/Payload"

          cp -R "${SHELL_APP}" "${APP}"

          # Replace Xcode stub with actual Zero Hour engine
          cp "${GAME_BIN}" "${APP}/GeneralsXZH"
          chmod +x "${APP}/GeneralsXZH"

          mkdir -p "${APP}/Frameworks"

          copy_required () {
            SRC="$1"

            if [ ! -f "${SRC}" ]; then
              echo "Missing required library:"
              echo "${SRC}"
              exit 1
            fi

            cp "${SRC}" "${APP}/Frameworks/"
          }

          copy_required \
            "${BUILD}/_deps/dxvk-build-macos/src/d3d8/libdxvk_d3d8.0.dylib"

          copy_required \
            "${BUILD}/_deps/dxvk-build-macos/src/d3d9/libdxvk_d3d9.0.dylib"

          copy_required \
            "${BUILD}/_deps/sdl3-build/libSDL3.0.dylib"

          copy_required \
            "${BUILD}/_deps/sdl3_image-build/libSDL3_image.0.dylib"

          copy_required \
            "${BUILD}/_deps/openal_soft-build/libopenal.1.24.2.dylib"

          if [ -f "${BUILD}/libgamespy.dylib" ]; then
            cp "${BUILD}/libgamespy.dylib" \
               "${APP}/Frameworks/"
          fi

          mv \
            "${APP}/Frameworks/libopenal.1.24.2.dylib" \
            "${APP}/Frameworks/libopenal.1.dylib"

          MVK="${GX_MOLTENVK_ROOT}/MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework"

          cp -R "${MVK}" "${APP}/Frameworks/"

          install_name_tool \
            -add_rpath "@executable_path/Frameworks" \
            "${APP}/GeneralsXZH" || true

          echo
          echo "Main executable dependencies:"
          otool -L "${APP}/GeneralsXZH"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          OUT="${RUNNER_TEMP}/GeneralsZH-iPad"

          cd "${OUT}"

          zip -qry \
            "${GITHUB_WORKSPACE}/GeneralsZH-iPad-unsigned.ipa" \
            Payload

          ls -lh "${GITHUB_WORKSPACE}/GeneralsZH-iPad-unsigned.ipa"

      - name: Prepare files for game-data packaging
        shell: bash
        run: |
          set -euo pipefail

          EXTRA="${RUNNER_TEMP}/ipad-extra"

          rm -rf "${EXTRA}"
          mkdir -p "${EXTRA}/fonts"

          cp "${GX_FONTS}"/*.ttf \
             "${EXTRA}/fonts/"

          cp ios/config/dxvk.conf \
             "${EXTRA}/dxvk.conf"

          cp ios/config/Options.ini \
             "${EXTRA}/DefaultOptions.ini"

          cat > "${EXTRA}/README.txt" <<'EOF'
          This archive does NOT contain commercial Command & Conquer game assets.
          
          When producing a self-contained IPA:
          
          1. Extract GeneralsZH-iPad-unsigned.ipa.
          2. Create:
             Payload/GeneralsXZH.app/GameData
          3. Copy your legally-owned Zero Hour game files into GameData.
          4. Copy fonts/, dxvk.conf and DefaultOptions.ini from this archive into GameData.
          5. Repack Payload as an IPA.
          6. Sign/sideload the resulting IPA using your own Apple account.
          EOF

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-iPad-unsigned
          path: GeneralsZH-iPad-unsigned.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Upload iPad extras
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-iPad-extra
          path: ${{ runner.temp }}/ipad-extra/
          retention-days: 7
          if-no-files-found: error
