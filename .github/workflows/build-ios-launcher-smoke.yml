name: Legacy | iPad | Launcher Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-launcher-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native launcher smoke IPA
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build unsigned smoke IPA
        run: |
          chmod +x scripts/build/ios/build-launcher-smoke.sh
          ./scripts/build/ios/build-launcher-smoke.sh

      - name: Upload smoke IPA
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-launcher-smoke-unsigned
          path: build/ios-launcher-smoke/GeneralsXZH-launcher-smoke-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
