name: Contra X | iPad | Full Build

on:
  workflow_dispatch:

    inputs:
      shell_run_id:
        description: "Optional successful Shared iPad Engine Shell run ID; blank uses latest"
        required: false
        type: string
  workflow_run:
    workflows:
      - Shared | iPad | Engine Shell
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: contra-x-ipad-full
  cancel-in-progress: true

env:
  ASSETS_RELEASE: contra-ipad-inputs-v1
  SHELL_ARTIFACT: GeneralsXZH-launcher-unsigned
  OUTPUT_IPA: build-output/GeneralsZH-ContraX-unsigned.ipa
  BASE_SHA256: 8e45d25c86ad3892704cfd5b732b7c5fe6da0027473b2828cb82cf4d89a0f54f
  CONTRA_BETA2_MD5: 8750dd02d36547b7d3bf6fd233c02675
  CONTRA_PATCH1_MD5: d013988243cb9945f1adeae335921c24

jobs:
  package:
    name: Package Contra X for iPad
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout iOS packaging code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 1
          submodules: false

      - name: Resolve successful engine shell
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ inputs.shell_run_id }}
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            RUN_ID="${AUTO_RUN_ID}"
          elif [[ -n "${MANUAL_RUN_ID:-}" ]]; then
            RUN_ID="${MANUAL_RUN_ID}"
          else
            RUN_ID="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow build-ios-shell.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi

          test -n "${RUN_ID}" || {
            echo "ERROR: no successful Shared | iPad | Engine Shell run found"
            exit 1
          }

          CONCLUSION="$(gh run view "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json conclusion \
            --jq '.conclusion')"

          test "${CONCLUSION}" = "success" || {
            echo "ERROR: shell run ${RUN_ID} conclusion is ${CONCLUSION}"
            exit 1
          }

          echo "SHELL_RUN_ID=${RUN_ID}" >> "${GITHUB_ENV}"
          echo "Using engine shell run ${RUN_ID}"

      - name: Download engine shell
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-input/shell
          gh run download "${SHELL_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${SHELL_ARTIFACT}" \
            --dir build-input/shell

          SHELL_IPA="$(find build-input/shell -type f -name '*.ipa' -print -quit)"
          test -n "${SHELL_IPA}" && test -f "${SHELL_IPA}"
          echo "SHELL_IPA=${SHELL_IPA}" >> "${GITHUB_ENV}"
          echo "Shell: ${SHELL_IPA}"

      - name: Download private Contra build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-input/assets

          DRAFT="$(gh release view "${ASSETS_RELEASE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq '.isDraft')"

          test "${DRAFT}" = "true" || {
            echo "ERROR: ${ASSETS_RELEASE} must remain a private draft release"
            exit 1
          }

          gh release download "${ASSETS_RELEASE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir build-input/assets \
            --pattern 'GeneralsZH-FULL-unsigned.ipa' \
            --pattern 'ContraXBeta2.zip' \
            --pattern 'ContraXBeta2Patch1.zip'

          test -f build-input/assets/GeneralsZH-FULL-unsigned.ipa
          test -f build-input/assets/ContraXBeta2.zip
          test -f build-input/assets/ContraXBeta2Patch1.zip

      - name: Verify private inputs
        shell: bash
        run: |
          set -euo pipefail

          echo "${BASE_SHA256}  build-input/assets/GeneralsZH-FULL-unsigned.ipa" | sha256sum -c -
          echo "${CONTRA_BETA2_MD5}  build-input/assets/ContraXBeta2.zip" | md5sum -c -
          echo "${CONTRA_PATCH1_MD5}  build-input/assets/ContraXBeta2Patch1.zip" | md5sum -c -

          df -h .

      - name: Package Contra X IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output

          python3 scripts/build/ios/build-variant-ipa.py \
            --variant contra \
            --shell "${SHELL_IPA}" \
            --base-ipa build-input/assets/GeneralsZH-FULL-unsigned.ipa \
            --contra-beta2 build-input/assets/ContraXBeta2.zip \
            --contra-patch1 build-input/assets/ContraXBeta2Patch1.zip \
            --output "${OUTPUT_IPA}"

      - name: Verify Contra X IPA
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/build/ios/verify-variant-ipa.py \
            --variant contra \
            "${OUTPUT_IPA}"

          SHA256="$(sha256sum "${OUTPUT_IPA}" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c '%s' "${OUTPUT_IPA}")"
          SIZE_GIB="$(python3 -c "print(f'{int(${SIZE_BYTES}) / 1024 / 1024 / 1024:.2f}')")"

          {
            echo "shell_run_id=${SHELL_RUN_ID}"
            echo "sha256=${SHA256}"
            echo "size_bytes=${SIZE_BYTES}"
            echo "size_gib=${SIZE_GIB}"
          } > build-output/contra-build-info.txt

          echo "CONTRA_SHA256=${SHA256}" >> "${GITHUB_ENV}"
          echo "CONTRA_SIZE_GIB=${SIZE_GIB}" >> "${GITHUB_ENV}"

      - name: Upload Contra X iPad IPA
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-ContraX-iPad-unsigned
          path: |
            build-output/GeneralsZH-ContraX-unsigned.ipa
            build-output/contra-build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Contra X | iPad | Full Build"
            echo "- Engine shell run: ${SHELL_RUN_ID}"
            echo "- Profile: contra-x (auto launch)"
            echo "- Contra: Beta 2 + Patch 1"
            echo "- IPA size: ${CONTRA_SIZE_GIB} GiB"
            echo "- SHA-256: \`${CONTRA_SHA256}\`"
            echo "- Artifact: \`GeneralsZH-ContraX-iPad-unsigned\`"
            echo "- Artifact retention: 3 days"
          } >> "${GITHUB_STEP_SUMMARY}"
