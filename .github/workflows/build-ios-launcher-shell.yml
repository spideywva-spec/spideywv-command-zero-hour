name: Legacy | iPad | Launcher Shell

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-launcher-shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GeneralsXZH iOS launcher shell
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout iOS DXVK submodule tree
        run: git submodule update --init --recursive --depth 1 references/fbraz3-dxvk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '18ff00a7d2697e23f22e2a2293c3fa6468a50c06'

      - name: Install build tools
        run: |
          brew update
          brew install cmake ninja meson pkg-config autoconf autoconf-archive automake libtool xcodegen glslang
          cmake --version
          ninja --version
          meson --version
          glslangValidator --version
          xcodegen --version
          xcodebuild -version

      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.4.341.1"
          ZIP="/tmp/vulkansdk-macos-${VERSION}.zip"
          URL="https://sdk.lunarg.com/sdk/download/${VERSION}/mac/vulkansdk-macos-${VERSION}.zip"
          SHA256="632cbe96c8ed6ed00c6ce25e3a7738c466134f76586e1c51f1419410d7f9042e"
          EXTRACT="/tmp/vulkan-extract"
          ROOT="$HOME/VulkanSDK/${VERSION}"

          curl -fL --retry 3 --retry-delay 5 -o "${ZIP}" "${URL}"
          echo "${SHA256}  ${ZIP}" | shasum -a 256 -c -
          rm -rf "${EXTRACT}"
          mkdir -p "${EXTRACT}"
          unzip -q "${ZIP}" -d "${EXTRACT}"

          INSTALLER=$(find "${EXTRACT}" -path "*/Contents/MacOS/vulkansdk-macOS-${VERSION}" -type f | head -1)
          if [[ -z "${INSTALLER}" ]]; then
            echo "ERROR: Vulkan SDK installer not found"
            find "${EXTRACT}" -maxdepth 4 -type f | head -50
            exit 1
          fi

          chmod +x "${INSTALLER}"
          "${INSTALLER}" \
            --root "${ROOT}" \
            --accept-licenses \
            --default-answer \
            --confirm-command install

          if [[ -d "${ROOT}/macOS" ]]; then
            SDK="${ROOT}/macOS"
          else
            SDK="${ROOT}"
          fi

          test -f "${SDK}/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          test -d "${SDK}/include/vulkan"

          echo "VULKAN_SDK=${SDK}" >> "${GITHUB_ENV}"
          echo "Vulkan SDK: ${SDK}"
          ls -lh "${SDK}/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

      - name: Stage iOS runtime resources
        run: |
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Vite launcher
        working-directory: launcher_vite
        run: |
          npm install
          npm run build
          test -f dist/index.html
          du -sh dist

      - name: Configure iOS
        env:
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: arm64-ios
          CC: clang
          CXX: clang++
        run: |
          mkdir -p logs
          cmake --preset ios-vulkan 2>&1 | tee logs/configure_ios.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Build iOS engine
        run: |
          mkdir -p logs
          NPROC=$(sysctl -n hw.ncpu)
          cmake --build build/ios-vulkan --target z_generals -j "${NPROC}" 2>&1 | tee logs/build_ios.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Verify iOS binary
        run: |
          BIN="build/ios-vulkan/GeneralsMD/GeneralsXZH.app/GeneralsXZH"
          test -f "${BIN}"
          file "${BIN}"
          file "${BIN}" | grep -q "Mach-O"
          lipo -info "${BIN}" | grep -q arm64

      - name: Package unsigned launcher shell
        env:
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
          GX_BUNDLE_ID: com.dvorov.generalszh.launcher
        run: |
          ./scripts/build/ios/package-ios-zh.sh --dev --unsigned
          IPA="build/ios-package/GeneralsXZH-launcher-unsigned.ipa"
          test -f "${IPA}"
          unzip -l "${IPA}" | grep -q "Payload/GeneralsXZH.app/Launcher/index.html"
          unzip -l "${IPA}" | grep -q "Payload/GeneralsXZH.app/GeneralsXZH"
          echo "IPA_SIZE=$(du -h "${IPA}" | cut -f1)" >> "${GITHUB_ENV}"

      - name: Upload launcher shell
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-launcher-unsigned
          path: build/ios-package/GeneralsXZH-launcher-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-ios-launcher-build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "## iOS launcher shell" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Engine: GeneralsXZH arm64" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Launcher: Vite + WKWebView bridge" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Retail GameData: not included" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Mod profiles: not included" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Artifact size: ${IPA_SIZE}" >> "${GITHUB_STEP_SUMMARY}"
