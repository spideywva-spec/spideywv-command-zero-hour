name: Online | macOS | Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GeneralsZH Online macOS arm64
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout DXVK fork
        run: git submodule update --init --recursive --depth 1 references/fbraz3-dxvk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '18ff00a7d2697e23f22e2a2293c3fa6468a50c06'

      - name: Install build tools
        run: |
          brew update
          brew install cmake ninja meson pkg-config autoconf autoconf-archive automake libtool glslang protobuf ccache
          brew install ffmpeg freetype fontconfig sdl3

      - name: Prepare build caches
        id: cache-context
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.ci-cache/vcpkg" "${CCACHE_DIR}"
          echo "VCPKG_BINARY_SOURCES=clear;files,${GITHUB_WORKSPACE}/.ci-cache/vcpkg,readwrite" >> "${GITHUB_ENV}"
          TOOLCHAIN=$( { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; xcrun clang --version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "toolchain=${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/vcpkg
          key: macos-online-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-context.outputs.toolchain }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/**', 'CMakePresets.json', '.github/workflows/build-macos-online.yml') }}
          restore-keys: |
            macos-online-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-context.outputs.toolchain }}-

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-online-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-context.outputs.toolchain }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            macos-online-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-context.outputs.toolchain }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Install Vulkan SDK
        run: |
          set -euo pipefail
          VERSION="1.4.341.1"
          ZIP="/tmp/vulkansdk-macos-${VERSION}.zip"
          ROOT="$HOME/VulkanSDK/${VERSION}"
          EXTRACT="/tmp/vulkan-extract"
          curl -fL --retry 3 --retry-delay 5 -o "${ZIP}" "https://sdk.lunarg.com/sdk/download/${VERSION}/mac/vulkansdk-macos-${VERSION}.zip"
          echo "632cbe96c8ed6ed00c6ce25e3a7738c466134f76586e1c51f1419410d7f9042e  ${ZIP}" | shasum -a 256 -c -
          mkdir -p "${EXTRACT}"
          unzip -q "${ZIP}" -d "${EXTRACT}"
          INSTALLER=$(find "${EXTRACT}" -path "*/Contents/MacOS/vulkansdk-macOS-${VERSION}" -type f | head -1)
          test -n "${INSTALLER}"
          chmod +x "${INSTALLER}"
          "${INSTALLER}" --root "${ROOT}" --accept-licenses --default-answer --confirm-command install
          if [[ -d "${ROOT}/macOS" ]]; then SDK="${ROOT}/macOS"; else SDK="${ROOT}"; fi
          test -f "${SDK}/lib/libMoltenVK.dylib"
          test -f "${SDK}/lib/libvulkan.dylib"
          echo "VULKAN_SDK=${SDK}" >> "${GITHUB_ENV}"
          echo "${SDK}/bin" >> "${GITHUB_PATH}"

      - name: Configure macOS Online
        env:
          VCPKG_DEFAULT_TRIPLET: arm64-osx
          CC: clang
          CXX: clang++
        run: |
          mkdir -p logs
          cmake --preset macos-vulkan-online -DCMAKE_CXX_FLAGS=-ferror-limit=0 2>&1 | tee logs/configure_macos_online.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Save vcpkg binaries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/vcpkg
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build macOS Online engine
        id: engine-build
        run: |
          cmake --build build/macos-vulkan-online --target z_generals -j "$(sysctl -n hw.ncpu)" -- -k 0 2>&1 | tee logs/build_macos_online.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Compiler cache statistics
        if: ${{ !cancelled() && (steps.engine-build.outcome == 'success' || steps.engine-build.outcome == 'failure') }}
        run: ccache --show-stats --verbose

      - name: Save compiler cache
        if: ${{ !cancelled() && (steps.engine-build.outcome == 'success' || steps.engine-build.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Verify and package Online app
        env:
          GX_MAC_ONLINE: '1'
        run: |
          BIN="build/macos-vulkan-online/GeneralsMD/GeneralsXZH"
          file "${BIN}" | grep -q 'Mach-O'
          lipo -info "${BIN}" | grep -q arm64
          bash scripts/build/macos/package-macos-contra-dev.sh 2>&1 | tee logs/package_macos_online.log
          test ${PIPESTATUS[0]} -eq 0
          test -f GeneralsZH-Online-macos-arm64.tar
          tar -tf GeneralsZH-Online-macos-arm64.tar | grep -q 'Install Online Data.command'

      - name: Upload macOS Online app
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-Online-macos-arm64
          path: GeneralsZH-Online-macos-arm64.tar
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-Online-macos-build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
