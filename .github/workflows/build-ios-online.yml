# iOS-only build with persistent dependency and compiler caches
name: Online | iPad | Build

on:
  workflow_dispatch:

  push:
    branches:
      - feature/generals-online-apple
    paths:
      - 'GeneralsMD/**'
      - '!GeneralsMD/Code/Main/IOSProfileLauncher.mm'
      - '!GeneralsMD/Code/Main/IOSProfileLauncher.h'
      - 'Core/**'
      - 'Dependencies/Utility/**'
      - 'resources/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-lock.json'
      - 'Patches/dxvk-ios.patch'
      - 'ios/**'
      - '!ios/version.env'
      - 'scripts/build/ios/package-shell.sh'
      - 'scripts/build/ios/fetch-moltenvk.sh'
      - 'scripts/build/ios/stage-fonts.sh'
      - '.github/workflows/build-ios-online.yml'
      - '.github/workflows/build-macos-online.yml'

permissions:
  contents: read

concurrency:
  group: ios-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GeneralsXZH iOS + Generals Online
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout DXVK fork
        run: git submodule update --init --recursive --depth 1 references/fbraz3-dxvk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '18ff00a7d2697e23f22e2a2293c3fa6468a50c06'

      - name: Install build tools
        run: |
          brew update
          brew install cmake ninja meson pkg-config autoconf autoconf-archive automake libtool xcodegen glslang protobuf ccache

      - name: Prepare build caches
        id: cache-context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.ci-cache/vcpkg" "${CCACHE_DIR}"
          echo "VCPKG_BINARY_SOURCES=clear;files,${GITHUB_WORKSPACE}/.ci-cache/vcpkg,readwrite" >> "${GITHUB_ENV}"
          # Keep caches separate when the runner's compiler or SDK changes.
          TOOLCHAIN=$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; xcrun clang --version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "toolchain=${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/vcpkg
          key: ios-online-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-context.outputs.toolchain }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/**', 'CMakePresets.json', '.github/workflows/build-ios-online.yml') }}
          restore-keys: |
            ios-online-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-context.outputs.toolchain }}-

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ios-online-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-context.outputs.toolchain }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-online-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-context.outputs.toolchain }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.4.341.1"
          ZIP="/tmp/vulkansdk-macos-${VERSION}.zip"
          URL="https://sdk.lunarg.com/sdk/download/${VERSION}/mac/vulkansdk-macos-${VERSION}.zip"
          SHA256="632cbe96c8ed6ed00c6ce25e3a7738c466134f76586e1c51f1419410d7f9042e"
          EXTRACT="/tmp/vulkan-extract"
          ROOT="$HOME/VulkanSDK/${VERSION}"

          curl -fL --retry 3 --retry-delay 5 -o "${ZIP}" "${URL}"
          echo "${SHA256}  ${ZIP}" | shasum -a 256 -c -
          rm -rf "${EXTRACT}"
          mkdir -p "${EXTRACT}"
          unzip -q "${ZIP}" -d "${EXTRACT}"

          INSTALLER=$(find "${EXTRACT}" -path "*/Contents/MacOS/vulkansdk-macOS-${VERSION}" -type f | head -1)
          test -n "${INSTALLER}"
          chmod +x "${INSTALLER}"
          "${INSTALLER}" --root "${ROOT}" --accept-licenses --default-answer --confirm-command install

          if [[ -d "${ROOT}/macOS" ]]; then SDK="${ROOT}/macOS"; else SDK="${ROOT}"; fi
          test -f "${SDK}/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          test -d "${SDK}/include/vulkan"
          echo "VULKAN_SDK=${SDK}" >> "${GITHUB_ENV}"

      - name: Stage runtime resources
        run: |
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS
        env:
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: arm64-ios
          CC: clang
          CXX: clang++
        run: |
          mkdir -p logs
          cmake --preset ios-vulkan-online -DCMAKE_CXX_FLAGS=-ferror-limit=0 2>&1 | tee logs/configure_ios_online.log
          test ${PIPESTATUS[0]} -eq 0

      # Save before compiling the engine, so source errors cannot discard the cache.
      - name: Save vcpkg binaries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/vcpkg
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build iOS engine
        id: engine-build
        run: |
          mkdir -p logs
          NPROC=$(sysctl -n hw.ncpu)
          # Keep compiling independent objects after errors to expose all current blockers.
          cmake --build build/ios-vulkan-online --target z_generals -j "${NPROC}" -- -k 0 2>&1 | tee logs/build_ios_online.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Compiler cache statistics
        if: ${{ !cancelled() && (steps.engine-build.outcome == 'success' || steps.engine-build.outcome == 'failure') }}
        run: ccache --show-stats --verbose

      - name: Save compiler cache
        if: ${{ !cancelled() && (steps.engine-build.outcome == 'success' || steps.engine-build.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Verify binary
        run: |
          BIN="build/ios-vulkan-online/GeneralsMD/GeneralsXZH.app/GeneralsXZH"
          test -f "${BIN}"
          file "${BIN}" | grep -q "Mach-O"
          lipo -info "${BIN}" | grep -q arm64

      - name: Package unsigned Online shell
        env:
          GX_BUNDLE_ID: com.dvorov.generalszh.online
          GX_BUILD_DIR: ${{ github.workspace }}/build/ios-vulkan-online
          GX_IPA_NAME: GeneralsXZH-online-unsigned.ipa
        run: |
          chmod +x scripts/build/ios/package-shell.sh
          ./scripts/build/ios/package-shell.sh
          IPA="build/ios-package/GeneralsXZH-online-unsigned.ipa"
          test -f "${IPA}"
          unzip -l "${IPA}" | grep -q "Payload/GeneralsXZH.app/GeneralsXZH"
          if unzip -l "${IPA}" | grep -q "Payload/GeneralsXZH.app/Launcher/"; then
            echo "ERROR: legacy web launcher leaked into native shell"
            exit 1
          fi
          echo "IPA_SIZE=$(du -h "${IPA}" | cut -f1)" >> "${GITHUB_ENV}"

      - name: Upload shell
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-online-unsigned
          path: build/ios-package/GeneralsXZH-online-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-ios-online-build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "## iOS Generals Online shell" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Engine: GeneralsXZH arm64" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Launcher: native UIKit" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Generals Online: enabled (Apple 30 Hz milestone)" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Deterministic math: enabled for Apple Online presets" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Retail GameData: not included" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Mod profiles: not included" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Artifact size: ${IPA_SIZE}" >> "${GITHUB_STEP_SUMMARY}"
