name: Shared | iPad | Launcher Fast

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'GeneralsMD/Code/Main/IOSProfileLauncher.mm'
      - 'GeneralsMD/Code/Main/IOSProfileLauncher.h'
      - 'scripts/build/ios/package-launcher-fast.sh'
      - 'ios/version.env'
      - '.github/workflows/build-ios-launcher-fast.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-launcher-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GeneralsXZH launcher-only
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Download latest successful full shell
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_RUN_ID="$(gh run list             --repo "${GITHUB_REPOSITORY}"             --workflow build-ios-shell.yml             --branch main             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId')"

          if [[ -z "${BASE_RUN_ID}" ]]; then
            echo "No successful main shell exists yet; using the latest successful shell as a bootstrap base."
            BASE_RUN_ID="$(gh run list             --repo "${GITHUB_REPOSITORY}"             --workflow build-ios-shell.yml             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId')"
          fi

          test -n "${BASE_RUN_ID}" || {
            echo "ERROR: no successful Shared | iPad | Engine Shell run found"
            exit 1
          }

          rm -rf base-shell
          mkdir -p base-shell
          gh run download "${BASE_RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name GeneralsXZH-launcher-unsigned             --dir base-shell

          BASE_IPA="$(find base-shell -type f -name '*.ipa' -print -quit)"
          test -n "${BASE_IPA}" && test -f "${BASE_IPA}" || {
            echo "ERROR: full-shell artifact contains no IPA"
            exit 1
          }

          BASE_HEAD_SHA="$(gh run view "${BASE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json headSha \
            --jq '.headSha')"

          test -n "${BASE_HEAD_SHA}" || BASE_HEAD_SHA="unknown"

          echo "BASE_RUN_ID=${BASE_RUN_ID}" >> "${GITHUB_ENV}"
          echo "BASE_IPA=${BASE_IPA}" >> "${GITHUB_ENV}"
          echo "GX_ENGINE_COMMIT=${BASE_HEAD_SHA}" >> "${GITHUB_ENV}"
          echo "GX_BASE_SHELL_RUN=${BASE_RUN_ID}" >> "${GITHUB_ENV}"
          echo "Using full shell from run #${BASE_RUN_ID} (${BASE_HEAD_SHA})"

      - name: Compile and inject launcher
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build/ios/package-launcher-fast.sh
          mkdir -p build/ios-launcher-fast
          ./scripts/build/ios/package-launcher-fast.sh             "${BASE_IPA}"             "${PWD}/build/ios-launcher-fast/GeneralsXZH-launcher-unsigned.ipa"

      - name: Verify launcher IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="build/ios-launcher-fast/GeneralsXZH-launcher-unsigned.ipa"
          test -f "${IPA}"

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          ditto -x -k "${IPA}" "${VERIFY_DIR}"

          APP="$(find "${VERIFY_DIR}/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "${APP}"
          test -f "${APP}/GeneralsXZH"
          test -f "${APP}/Frameworks/libGeneralsXLauncher.dylib"

          file "${APP}/Frameworks/libGeneralsXLauncher.dylib" | grep -q "Mach-O"
          lipo -info "${APP}/Frameworks/libGeneralsXLauncher.dylib" | grep -q arm64
          otool -L "${APP}/GeneralsXZH" | grep -q "@rpath/libGeneralsXLauncher.dylib"
          otool -D "${APP}/Frameworks/libGeneralsXLauncher.dylib" | grep -q "@rpath/libGeneralsXLauncher.dylib"

          if find "${APP}" -name "_CodeSignature" -type d | grep -q .; then
            echo "ERROR: code signature leaked into unsigned launcher IPA"
            exit 1
          fi

          echo "IPA_SIZE=$(du -h "${IPA}" | cut -f1)" >> "${GITHUB_ENV}"

      - name: Upload launcher
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-launcher-unsigned
          path: build/ios-launcher-fast/GeneralsXZH-launcher-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: success()
        run: |
          echo "## Fast iOS launcher build" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Base full-shell run: ${BASE_RUN_ID}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Engine rebuilt: no" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Rebuilt: libGeneralsXLauncher.dylib only" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Artifact size: ${IPA_SIZE}" >> "${GITHUB_STEP_SUMMARY}"
