name: Enhanced | iPad | Full Build

on:
  workflow_dispatch:

    inputs:
      shell_run_id:
        description: "Optional successful Shared iPad Engine Shell run ID; blank uses latest"
        required: false
        type: string
permissions:
  contents: write
  actions: read

concurrency:
  group: enhanced-ipad-full
  cancel-in-progress: true

env:
  ASSETS_RELEASE: enhanced-ipad-inputs-v1
  SHELL_ARTIFACT: GeneralsXZH-launcher-unsigned
  OUTPUT_IPA: build-output/GeneralsZH-Enhanced-unsigned.ipa
  BASE_SHA256: 8e45d25c86ad3892704cfd5b732b7c5fe6da0027473b2828cb82cf4d89a0f54f

jobs:
  package:
    name: Package Enhanced for iPad
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout iOS packaging code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 1
          submodules: false

      - name: Resolve successful engine shell
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ inputs.shell_run_id }}
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            RUN_ID="${AUTO_RUN_ID}"
          elif [[ -n "${MANUAL_RUN_ID:-}" ]]; then
            RUN_ID="${MANUAL_RUN_ID}"
          else
            RUN_ID="$(gh run list               --repo "${GITHUB_REPOSITORY}"               --workflow build-ios-shell.yml               --branch main               --status success               --limit 1               --json databaseId               --jq '.[0].databaseId')"
          fi

          test -n "${RUN_ID}" || {
            echo "ERROR: no successful Shared | iPad | Engine Shell run found"
            exit 1
          }

          CONCLUSION="$(gh run view "${RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --json conclusion             --jq '.conclusion')"

          test "${CONCLUSION}" = "success" || {
            echo "ERROR: shell run ${RUN_ID} conclusion is ${CONCLUSION}"
            exit 1
          }

          echo "SHELL_RUN_ID=${RUN_ID}" >> "${GITHUB_ENV}"
          echo "Using engine shell run ${RUN_ID}"

      - name: Download engine shell
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-input/shell
          gh run download "${SHELL_RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name "${SHELL_ARTIFACT}"             --dir build-input/shell

          SHELL_IPA="$(find build-input/shell -type f -name '*.ipa' -print -quit)"
          test -n "${SHELL_IPA}" && test -f "${SHELL_IPA}"
          echo "SHELL_IPA=${SHELL_IPA}" >> "${GITHUB_ENV}"
          echo "Shell: ${SHELL_IPA}"

      - name: Download private Enhanced build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-input/assets

          DRAFT="$(gh release view "${ASSETS_RELEASE}"             --repo "${GITHUB_REPOSITORY}"             --json isDraft             --jq '.isDraft')"

          test "${DRAFT}" = "true" || {
            echo "ERROR: ${ASSETS_RELEASE} must remain a private draft release"
            exit 1
          }

          gh release download "${ASSETS_RELEASE}"             --repo "${GITHUB_REPOSITORY}"             --dir build-input/assets             --pattern 'GeneralsZH-FULL-unsigned.ipa'             --pattern 'EnhancedProfile-part-*.zip'             --pattern 'enhanced-inputs.json'             --pattern 'enhanced-inputs.sha256'

          test -f build-input/assets/GeneralsZH-FULL-unsigned.ipa
          test -f build-input/assets/enhanced-inputs.json
          test -f build-input/assets/enhanced-inputs.sha256
          compgen -G 'build-input/assets/EnhancedProfile-part-*.zip' >/dev/null

      - name: Verify and extract private inputs
        shell: bash
        run: |
          set -euo pipefail

          echo "${BASE_SHA256}  build-input/assets/GeneralsZH-FULL-unsigned.ipa" | sha256sum -c -

          (
            cd build-input/assets
            sha256sum -c enhanced-inputs.sha256
          )

          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build-input/assets/enhanced-inputs.json").read_text())
          assert manifest["schemaVersion"] == 1
          assert manifest["profile"] == "enhanced"
          assert manifest["patchPresent"] is True
          assert manifest["profileFiles"] > 0
          assert len(manifest["parts"]) > 0
          print(
              f"Enhanced manifest: {manifest['profileFiles']} files, "
              f"{len(manifest['parts'])} parts"
          )
          PY

          mkdir -p build-input/enhanced
          for part in build-input/assets/EnhancedProfile-part-*.zip; do
            unzip -q -o "${part}" -d build-input/enhanced
          done

          test -d build-input/enhanced/ZHE
          test -f build-input/enhanced/ZHE/!!ZHE8Patch_99.big
          df -h .

      - name: Package Enhanced IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output

          python3 scripts/build/ios/build-variant-ipa.py             --variant enhanced             --shell "${SHELL_IPA}"             --base-ipa build-input/assets/GeneralsZH-FULL-unsigned.ipa             --enhanced build-input/enhanced/ZHE             --output "${OUTPUT_IPA}"

      - name: Verify Enhanced IPA
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/build/ios/verify-variant-ipa.py             --variant enhanced             "${OUTPUT_IPA}"

          SHA256="$(sha256sum "${OUTPUT_IPA}" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c '%s' "${OUTPUT_IPA}")"
          SIZE_GIB="$(python3 -c "print(f'{int(${SIZE_BYTES}) / 1024 / 1024 / 1024:.2f}')")"

          {
            echo "shell_run_id=${SHELL_RUN_ID}"
            echo "sha256=${SHA256}"
            echo "size_bytes=${SIZE_BYTES}"
            echo "size_gib=${SIZE_GIB}"
          } > build-output/enhanced-build-info.txt

          echo "ENHANCED_SHA256=${SHA256}" >> "${GITHUB_ENV}"
          echo "ENHANCED_SIZE_GIB=${SIZE_GIB}" >> "${GITHUB_ENV}"

      - name: Upload Enhanced iPad IPA
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsZH-Enhanced-iPad-unsigned
          path: |
            build-output/GeneralsZH-Enhanced-unsigned.ipa
            build-output/enhanced-build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Enhanced | iPad | Full Build"
            echo "- Engine shell run: ${SHELL_RUN_ID}"
            echo "- Profile: enhanced (dedicated launcher)"
            echo "- Enhanced: v1.0 + patch 28/03/2024"
            echo "- IPA size: ${ENHANCED_SIZE_GIB} GiB"
            echo "- SHA-256: ${ENHANCED_SHA256}"
            echo "- Artifact: GeneralsZH-Enhanced-iPad-unsigned"
            echo "- Artifact retention: 3 days"
          } >> "${GITHUB_STEP_SUMMARY}"
