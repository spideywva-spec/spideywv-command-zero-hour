name: Legacy | Launcher | Vite

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - feature/vite-zero-hour-launcher
    paths:
      - 'launcher_vite/**'
      - '.github/workflows/build-zero-hour-launcher-vite.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'launcher_vite/**'
      - '.github/workflows/build-zero-hour-launcher-vite.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: launcher_vite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package preview
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ../ZeroHourLauncher-Vite.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroHourLauncher-Vite
          path: ZeroHourLauncher-Vite.zip
          if-no-files-found: error
          retention-days: 14
